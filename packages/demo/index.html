<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#07080e" />
		<title>TCM's Proxy</title>

		<script>
			// Capture anything that blows up while the engine bundles load so the
			// bootstrap guard below can report the real reason instead of a blank page.
			window.__bootErrors = [];
			window.addEventListener(
				"error",
				(event) => {
					const message =
						(event && event.message) ||
						(event && event.error && event.error.message) ||
						"script error";
					window.__bootErrors.push(String(message));
				},
				true
			);
		</script>
		<script src="/scramjet/scramjet.js"></script>
		<script src="/controller/controller.api.js"></script>
	</head>

	<body class="light-mode" style="margin: 0; background: #07080e">
		<div id="app"></div>
		<script type="module" src="/src/index.tsx"></script>
		<script>
			(function () {
				var escapeHtml = function (value) {
					return String(value).replace(/[&<>"']/g, function (c) {
						return {
							"&": "&amp;",
							"<": "&lt;",
							">": "&gt;",
							'"': "&quot;",
							"'": "&#39;",
						}[c];
					});
				};

				var missing = [];
				if (!window.$scramjet) missing.push("/scramjet/scramjet.js");
				if (!window.$scramjetController)
					missing.push("/controller/controller.api.js");
				if (!missing.length) return;

				var modifiers = true;
				try {
					new RegExp("(?i:a)");
				} catch (e) {
					modifiers = false;
				}

				var errors = (window.__bootErrors || []).slice(0, 3);
				var rows = [
					["Failed to load", missing.join(", ")],
					[
						"Browser errors",
						errors.length ? errors.join(" | ") : "(none reported)",
					],
				];

				var hints = [];
				if (!modifiers) {
					hints.push(
						"This browser does not support RegExp pattern modifiers, which the proxy engine build needs. Update the browser, or run `node scripts/fetch-prebuilt-dist.mjs --force` and reload."
					);
				}
				hints.push(
					"packages/*/dist may have been rebuilt without the rust rewriter. Run `node scripts/fetch-prebuilt-dist.mjs --force` to restore the published bundles, then reload."
				);

				var rowsHtml = rows
					.map(function (row) {
						return (
							'<div style="margin:0 0 10px">' +
							'<div style="font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:#6f7891;margin-bottom:3px">' +
							escapeHtml(row[0]) +
							"</div>" +
							'<div style="font-size:0.82rem;color:#dfe3f2;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-word">' +
							escapeHtml(row[1]) +
							"</div></div>"
						);
					})
					.join("");

				document.getElementById("app").innerHTML =
					'<div style="min-height:100vh;display:grid;place-items:center;padding:32px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#07080e;color:#e9ebf5;box-sizing:border-box">' +
					'<div style="max-width:620px">' +
					'<div style="font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;color:#ff8f8f;margin-bottom:10px">Startup error</div>' +
					'<h1 style="font-size:1.35rem;margin:0 0 12px;letter-spacing:-0.02em">The proxy engine did not load</h1>' +
					rowsHtml +
					'<ul style="color:#99a1b8;line-height:1.6;font-size:0.82rem;margin:14px 0 16px;padding-left:18px">' +
					hints
						.map(function (hint) {
							return "<li>" + escapeHtml(hint) + "</li>";
						})
						.join("") +
					"</ul>" +
					'<button onclick="location.reload()" style="border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:0.82rem;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#4f8bff)">Reload</button>' +
					"</div></div>";
			})();
		</script>
	</body>
</html>
