<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080e" />
    <title>TCM's Proxy</title>

    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
  </head>

  <body class="light-mode" style="margin: 0; background: #07080e">
    <div id="app"></div>
    <script>
      // The proxy engine bundle is a classic script loaded above; the app
      // module imports from it, so fail loudly instead of a blank screen.
      if (!window.$scramjet || !window.$scramjetController) {
        document.getElementById("app").innerHTML =
          '<div style="min-height:100vh;display:grid;place-items:center;padding:32px;' +
          "font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#07080e;color:#e9ebf5;" +
          'box-sizing:border-box"><div style="max-width:560px"><div style="font-size:0.7rem;' +
          'letter-spacing:0.16em;text-transform:uppercase;color:#ff8f8f;margin-bottom:10px">Startup error</div>' +
          '<h1 style="font-size:1.35rem;margin:0 0 10px;letter-spacing:-0.02em">The proxy engine did not load</h1>' +
          '<p style="color:#99a1b8;line-height:1.6;font-size:0.88rem;margin:0 0 14px">' +
          '<code style="color:#e9ebf5">/scramjet/scramjet.js</code> and ' +
          '<code style="color:#e9ebf5">/controller/controller.api.js</code> must load before the app. ' +
          'This usually means <code style="color:#e9ebf5">packages/core/dist</code> was rebuilt without the ' +
          'rust rewriter (<code style="color:#e9ebf5">pnpm rewriter:build</code>).</p>' +
          '<button onclick="location.reload()" style="border:0;border-radius:10px;padding:9px 14px;' +
          "font:inherit;font-size:0.82rem;font-weight:600;color:#fff;cursor:pointer;" +
          'background:linear-gradient(135deg,#7c5cff,#4f8bff)">Reload</button></div></div>';
      }
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
